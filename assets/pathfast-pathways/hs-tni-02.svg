<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1480 1000" role="img" aria-labelledby="title desc"><title id="title">Sollis Health hs-TnI 0/2-hour chest pain pathway</title><desc id="desc">Static reference showing initial troponin and ECG, low-risk assessment, repeat testing at 2 hours, and provider-directed discharge, observation, or transfer pathways.</desc><defs><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#397d4f"/></marker><marker id="amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#b88732"/></marker><marker id="red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#b63c39"/></marker><marker id="black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3b4144"/></marker></defs><rect width="1480" height="1000" rx="18" fill="#fffdfa"/><rect x="248" y="165" width="1200" height="264" rx="36" fill="#eaf4ed"/><rect x="248" y="433" width="1200" height="290" rx="36" fill="#fbf2e2"/><rect x="248" y="730" width="1200" height="166" rx="32" fill="#f8e9e9"/><text x="32" y="55" fill="#282d30" font-size="37" font-weight="800" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SOLLIS</text><text x="33" y="80" fill="#414649" font-size="15" font-weight="650" text-anchor="start" font-family="Arial,Helvetica,sans-serif">H E A L T H</text><text x="805" y="64" fill="#2b3135" font-size="38" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">hs-TnI 0/2-Hour Chest Pain Pathway</text><path d="M123 351V471" fill="none" stroke="#3b4144" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#black)"/><path d="M224 521L267 521L286 270" fill="none" stroke="#397d4f" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><path d="M224 530H287" fill="none" stroke="#b88732" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M224 538L268 821H290" fill="none" stroke="#b63c39" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><path d="M498 270H546" fill="none" stroke="#397d4f" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><path d="M725 270H830" fill="none" stroke="#397d4f" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><path d="M1020 270H1192" fill="none" stroke="#397d4f" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><path d="M636 354V504" fill="none" stroke="#b88732" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M532 567H580" fill="none" stroke="#b88732" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M803 548L1193 486" fill="none" stroke="#397d4f" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><path d="M803 570L1192 654" fill="none" stroke="#b88732" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M803 592L1192 819" fill="none" stroke="#b63c39" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><path d="M531 819H1192" fill="none" stroke="#b63c39" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><rect x="24" y="295" width="200" height="110" rx="18" fill="#fff" stroke="#44494b" stroke-width="2.4"/><text x="124" y="329" fill="#28363d" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Patient presents</text><text x="124" y="356" fill="#28363d" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">with chest pain</text><rect x="24" y="470" width="200" height="118" rx="18" fill="#fff" stroke="#44494b" stroke-width="2.4"/><text x="124" y="508" fill="#28363d" font-size="18" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Obtain initial</text><text x="124" y="534" fill="#28363d" font-size="18" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">hs-TnI (0 h) + ECG</text><rect x="286" y="220" width="212" height="102" rx="18" fill="#fff" stroke="#397d4f" stroke-width="2.9"/><text x="392" y="252" fill="#27613e" font-size="17" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">RULE OUT:</text><text x="392" y="280" fill="#27613e" font-size="17" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Initial hs-TnI &lt; 4 ng/L</text><polygon points="636,179 725,270 636,354 546,270" fill="#fff" stroke="#397d4f" stroke-width="3"/><text x="636" y="239" fill="#28363d" font-size="16" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Symptom</text><text x="636" y="262" fill="#28363d" font-size="16" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">onset &gt; 3 h</text><text x="636" y="285" fill="#28363d" font-size="16" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">before arrival?</text><polygon points="926,183 1020,270 926,353 830,270" fill="#fff" stroke="#397d4f" stroke-width="3"/><text x="926" y="258" fill="#28363d" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">HEART</text><text x="926" y="284" fill="#28363d" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">score ≤ 3?</text><text x="776" y="251" fill="#377d4a" font-size="17" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Yes</text><text x="1070" y="249" fill="#377d4a" font-size="17" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Yes</text><text x="682" y="392" fill="#9d731e" font-size="17" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">No, onset ≤ 3 h</text><rect x="1193" y="203" width="238" height="120" rx="20" fill="#347544" stroke="#347544" stroke-width="2"/><text x="1312" y="244" fill="#fff" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DISCHARGE</text><text x="1312" y="269" fill="#fff" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Home with follow-up</text><text x="1312" y="294" fill="#fff" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">instructions</text><rect x="287" y="506" width="245" height="122" rx="18" fill="#fff" stroke="#b88732" stroke-width="2.6"/><text x="410" y="534" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">REPEAT AT 2 HOURS:</text><text x="410" y="558" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">hs-TnI &lt; 4 ng/L with</text><text x="410" y="582" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">onset ≤ 3 h, OR</text><text x="410" y="606" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">≥ 4 ng/L and &lt; 90 ng/L</text><rect x="580" y="507" width="223" height="119" rx="18" fill="#fff" stroke="#b88732" stroke-width="2.5"/><text x="691" y="550" fill="#28363d" font-size="19" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Obtain 2-hour</text><text x="691" y="578" fill="#28363d" font-size="19" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">repeat hs-TnI</text><rect x="1193" y="438" width="238" height="118" rx="20" fill="#fff35c" stroke="#a4ae2c" stroke-width="2.5"/><text x="1312" y="468" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">If HEART score ≤ 3,</text><text x="1312" y="491" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">consider additional</text><text x="1312" y="514" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">serial testing or close</text><text x="1312" y="537" fill="#28363d" font-size="17" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">cardiology follow-up</text><rect x="1193" y="596" width="238" height="116" rx="20" fill="#ecb85f" stroke="#ecb85f" stroke-width="2"/><text x="1312" y="624" fill="#28363d" font-size="17" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">OBSERVE / CONSULT</text><text x="1312" y="647" fill="#28363d" font-size="17" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Risk stratification,</text><text x="1312" y="670" fill="#28363d" font-size="17" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">further testing or</text><text x="1312" y="693" fill="#28363d" font-size="17" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">transfer. Consider cards.</text><rect x="875" y="402" width="302" height="51" rx="4" fill="#f9fdf9" stroke="none" stroke-width="0"/><text x="1026" y="422" fill="#357547" font-size="15" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">hs-TnI ≥ 4, delta &lt; 4 ng/L</text><text x="1026" y="444" fill="#357547" font-size="15" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">total &lt;21.4 (F) / 29.8 (M)</text><rect x="882" y="569" width="308" height="58" rx="4" fill="#fff8ed" stroke="none" stroke-width="0"/><text x="1036" y="591" fill="#af7627" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Delta ≥ 4 and &lt; 55 ng/L</text><text x="1036" y="609" fill="#af7627" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">or above sex-specific limit</text><text x="1036" y="627" fill="#af7627" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">or HEART &gt; 3</text><text x="975" y="739" fill="#ad3734" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Delta ≥ 55 ng/L</text><text x="975" y="762" fill="#ad3734" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">OR total ≥ 90 ng/L</text><rect x="291" y="770" width="239" height="111" rx="18" fill="#fff" stroke="#b63c39" stroke-width="2.7"/><text x="410" y="809" fill="#a52f2b" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">RULE IN:</text><text x="410" y="836" fill="#a52f2b" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Initial hs-TnI ≥ 90 ng/L</text><rect x="1193" y="757" width="238" height="127" rx="20" fill="#bc3933" stroke="#bc3933" stroke-width="2"/><text x="1312" y="790" fill="#fff" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">TRANSFER</text><text x="1312" y="814" fill="#fff" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ED transfer or direct</text><text x="1312" y="838" fill="#fff" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">admit for ACS / NSTEMI</text><text x="1312" y="862" fill="#fff" font-size="18" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">evaluation</text><rect x="24" y="914" width="1424" height="66" rx="11" fill="#f3eadc"/><text x="260" y="939" fill="#367748" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">RULE OUT: 0 h &lt; 4 with onset &gt; 3 h and HEART ≤ 3,</text><text x="260" y="958" fill="#367748" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">or 0 h &lt; 4 + 2 h delta &lt; 4 with HEART ≤ 3</text><text x="769" y="939" fill="#ac7a30" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">OBSERVE: 2 h delta ≥ 4 but &lt; 55,</text><text x="769" y="958" fill="#ac7a30" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">or concerning ECG / clinical risk</text><text x="1252" y="939" fill="#a93836" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">RULE IN: 0 h ≥ 90, 2 h delta ≥ 55,</text><text x="1252" y="958" fill="#a93836" font-size="14" font-weight="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">or 2 h total ≥ 90 ng/L</text></svg>