<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Sollis Health PATHFAST hs-TnI 0/2-hour chest pain pathway</title><desc id="chart-desc">Clinical reference showing baseline ECG and troponin, three initial troponin ranges, timed repeat testing, and rule-out, consider discharge, observe, and rule-in disposition groups. Provider review required.</desc><defs><filter id="softshadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#21425c" flood-opacity="0.07"/></filter></defs><rect x="0" y="0" width="1600" height="1470" rx="0" fill="#F6F9FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="11" rx="0" fill="#173B61" stroke="none" stroke-width="1"/><text x="68" y="62" fill="#173B61" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" letter-spacing="1">SOLLIS</text><text x="69" y="82" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="11" font-weight="650" text-anchor="start">H E A L T H</text><rect x="1260" y="33" width="272" height="34" rx="17" fill="#E7EFF8" stroke="none" stroke-width="1"/><text x="1396" y="56" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">PATHFAST  ·  PROVIDER</text><text x="68" y="142" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="40" font-weight="800" text-anchor="start">hs-TnI 0/2-Hour Chest Pain Pathway</text><text x="68" y="174" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="520" text-anchor="start">0/2-hour fallback • only after the 1-hour window is missed and a provider authorizes the change</text><rect x="68" y="214" width="180" height="34" rx="17" fill="#E7EFF8" stroke="none" stroke-width="1"/><text x="158" y="237" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">01  ·  BASELINE</text><g filter="url(#softshadow)"><rect x="68" y="262" width="1464" height="144" rx="19" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.3"/></g><circle cx="110" cy="314" r="22" fill="#EAF1F8"/><text x="110" y="322" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">1</text><text x="149" y="298" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="760" text-anchor="start">PRESENTATION</text><text x="149" y="333" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="720" text-anchor="start">Chest pain / suspected ACS</text><path d="M507 291V376" stroke="#DDE5ED" stroke-width="2"/><circle cx="556" cy="314" r="22" fill="#EAF1F8"/><text x="556" y="322" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">2</text><text x="597" y="298" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="760" text-anchor="start">INITIAL TESTING</text><text x="597" y="333" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="720" text-anchor="start">hs-TnI (0 h) + ECG</text><path d="M949 291V376" stroke="#DDE5ED" stroke-width="2"/><circle cx="995" cy="314" r="22" fill="#EAF1F8"/><text x="995" y="322" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">3</text><text x="1037" y="298" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="760" text-anchor="start">CLINICAL CONTEXT</text><text x="1037" y="333" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="720" text-anchor="start">Symptom onset + HEART score</text><text x="149" y="371" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Use actual collection time for serial testing.</text><rect x="68" y="434" width="252" height="34" rx="17" fill="#E7EFF8" stroke="none" stroke-width="1"/><text x="194" y="457" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">02  ·  INITIAL RESULT</text><g filter="url(#softshadow)"><rect x="68" y="490" width="468" height="280" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="69" y="491" width="466" height="7" rx="4" fill="#277D62" stroke="none" stroke-width="1"/><rect x="86" y="508" width="432" height="245" rx="13" fill="#EBF7F1" stroke="none" stroke-width="1"/></g><g filter="url(#softshadow)"><rect x="566" y="490" width="468" height="280" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="567" y="491" width="466" height="7" rx="4" fill="#B57428" stroke="none" stroke-width="1"/><rect x="584" y="508" width="432" height="245" rx="13" fill="#FFF3E6" stroke="none" stroke-width="1"/></g><g filter="url(#softshadow)"><rect x="1064" y="490" width="468" height="280" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="1065" y="491" width="466" height="7" rx="4" fill="#B64449" stroke="none" stroke-width="1"/><rect x="1082" y="508" width="432" height="245" rx="13" fill="#FFF0F0" stroke="none" stroke-width="1"/></g><rect x="92" y="513" width="155" height="34" rx="17" fill="#D0EEDD" stroke="none" stroke-width="1"/><text x="169.5" y="536" fill="#277D62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">LOW RESULT</text><text x="93" y="584" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="770" text-anchor="start">Initial hs-TnI &lt; 4 ng/L</text><path d="M94 604h416" stroke="#DDE5ED" stroke-width="1.5"/><circle cx="106" cy="639" r="6" fill="#277D62"/><text x="125" y="647" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="660" text-anchor="start">Onset &gt; 3 hours AND HEART ≤ 3:</text><text x="125" y="676" fill="#277D62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="720" text-anchor="start">Discharge home with follow-up instructions.</text><circle cx="106" cy="709" r="6" fill="#B57428"/><text x="125" y="718" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="610" text-anchor="start">Onset ≤ 3 hours: obtain timed repeat.</text><text x="125" y="743" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Other clinical concerns need provider review.</text><rect x="590" y="513" width="192" height="34" rx="17" fill="#FFE7C8" stroke="none" stroke-width="1"/><text x="686" y="536" fill="#B57428" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">SERIAL TESTING</text><text x="591" y="584" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="770" text-anchor="start">Initial hs-TnI ≥ 4 to &lt; 90 ng/L</text><path d="M592 604h416" stroke="#DDE5ED" stroke-width="1.5"/><text x="592" y="646" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">Obtain the 2-hour repeat hs-TnI.</text><text x="592" y="687" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="520" text-anchor="start">Compare absolute change (delta),</text><text x="592" y="712" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="520" text-anchor="start">repeat total and clinical risk.</text><rect x="1088" y="513" width="157" height="34" rx="17" fill="#F8D6D8" stroke="none" stroke-width="1"/><text x="1166.5" y="536" fill="#B64449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">RULE-IN</text><text x="1089" y="584" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="770" text-anchor="start">Initial hs-TnI ≥ 90 ng/L</text><path d="M1090 604h416" stroke="#DDE5ED" stroke-width="1.5"/><text x="1090" y="645" fill="#B64449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="820" text-anchor="start">TRANSFER</text><text x="1090" y="679" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="610" text-anchor="start">ED transfer or direct admission for</text><text x="1090" y="705" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="610" text-anchor="start">ACS / NSTEMI evaluation.</text><text x="1090" y="744" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="550" text-anchor="start">Provider-directed urgent escalation.</text><rect x="68" y="801" width="235" height="34" rx="17" fill="#E7EFF8" stroke="none" stroke-width="1"/><text x="185.5" y="824" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">03  ·  TIMED REPEAT</text><g filter="url(#softshadow)"><rect x="68" y="850" width="1464" height="137" rx="19" fill="#EAF1F8" stroke="#D5E3F0" stroke-width="1.4"/></g><circle cx="117" cy="919" r="32" fill="#173B61"/><circle cx="117" cy="919" r="21" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M117 905v16l12 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="172" y="896" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="790" text-anchor="start">120-minute repeat</text><text x="172" y="928" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="620" text-anchor="start">Target 120 min   ·   Approved window 110–135 min</text><text x="172" y="959" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="520" text-anchor="start">Time from FIRST blood draw, not analyzer result.</text><path d="M785 870V968" stroke="#CCDCEA" stroke-width="2"/><text x="833" y="892" fill="#3569A2" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="800" text-anchor="start">REVIEW TOGETHER</text><text x="833" y="924" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="750" text-anchor="start">Repeat hs-TnI + 2-hour delta</text><text x="833" y="954" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="540" text-anchor="start">ECG  ·  Symptoms  ·  HEART score  ·  Timing</text><rect x="68" y="1021" width="250" height="34" rx="17" fill="#E7EFF8" stroke="none" stroke-width="1"/><text x="193" y="1044" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">04  ·  DISPOSITION</text><g filter="url(#softshadow)"><rect x="68" y="1076" width="342" height="294" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="69" y="1077" width="340" height="7" rx="4" fill="#277D62" stroke="none" stroke-width="1"/><rect x="86" y="1094" width="306" height="259" rx="13" fill="#EBF7F1" stroke="none" stroke-width="1"/></g><g filter="url(#softshadow)"><rect x="442" y="1076" width="342" height="294" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="443" y="1077" width="340" height="7" rx="4" fill="#A47A18" stroke="none" stroke-width="1"/><rect x="460" y="1094" width="306" height="259" rx="13" fill="#FCF8E8" stroke="none" stroke-width="1"/></g><g filter="url(#softshadow)"><rect x="816" y="1076" width="342" height="294" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="817" y="1077" width="340" height="7" rx="4" fill="#B57428" stroke="none" stroke-width="1"/><rect x="834" y="1094" width="306" height="259" rx="13" fill="#FFF3E6" stroke="none" stroke-width="1"/></g><g filter="url(#softshadow)"><rect x="1190" y="1076" width="342" height="294" rx="18" fill="#FFFFFF" stroke="#DDE5ED" stroke-width="1.4"/><rect x="1191" y="1077" width="340" height="7" rx="4" fill="#B64449" stroke="none" stroke-width="1"/><rect x="1208" y="1094" width="306" height="259" rx="13" fill="#FFF0F0" stroke="none" stroke-width="1"/></g><rect x="91" y="1098" width="168" height="34" rx="17" fill="#CDEADC" stroke="none" stroke-width="1"/><text x="175" y="1121" fill="#277D62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">RULE-OUT REVIEW</text><text x="92" y="1158" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="720" text-anchor="start">Initial &lt; 4 ng/L AND</text><text x="92" y="1188" fill="#277D62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="820" text-anchor="start">2-h delta &lt; 4 ng/L</text><text x="92" y="1218" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="660" text-anchor="start">AND HEART score ≤ 3</text><path d="M92 1236h294" stroke="#DDE5ED" stroke-width="1.5"/><text x="92" y="1267" fill="#277D62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="760" text-anchor="start">Discharge with follow-up</text><text x="92" y="1295" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="520" text-anchor="start">only after provider review</text><text x="92" y="1322" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="520" text-anchor="start">of ECG and symptoms.</text><rect x="465" y="1098" width="201" height="34" rx="17" fill="#F6EAB7" stroke="none" stroke-width="1"/><text x="565.5" y="1121" fill="#A47A18" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">CONSIDER DISCHARGE</text><text x="466" y="1158" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="720" text-anchor="start">Initial ≥ 4 ng/L AND</text><text x="466" y="1188" fill="#A47A18" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="820" text-anchor="start">2-h delta &lt; 4 ng/L</text><text x="466" y="1216" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="670" text-anchor="start">Total &lt; 21.4 (F) / 29.8 (M)</text><path d="M466 1236h294" stroke="#DDE5ED" stroke-width="1.5"/><text x="466" y="1266" fill="#A47A18" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="720" text-anchor="start">If HEART ≤ 3, consider</text><text x="466" y="1294" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="520" text-anchor="start">additional serial testing or</text><text x="466" y="1321" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="520" text-anchor="start">discharge with close cardiology f/u.</text><rect x="839" y="1098" width="183" height="34" rx="17" fill="#FBE2BC" stroke="none" stroke-width="1"/><text x="930.5" y="1121" fill="#B57428" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">OBSERVE / CONSULT</text><text x="840" y="1158" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="760" text-anchor="start">2-h delta ≥ 4 and &lt; 55</text><text x="840" y="1185" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="610" text-anchor="start">OR total above sex-specific</text><text x="840" y="1211" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="610" text-anchor="start">limit but &lt; 90 ng/L</text><text x="840" y="1237" fill="#B57428" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="720" text-anchor="start">OR HEART score &gt; 3</text><path d="M840 1253h294" stroke="#DDE5ED" stroke-width="1.5"/><text x="840" y="1282" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="530" text-anchor="start">Risk stratification, shared</text><text x="840" y="1307" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="530" text-anchor="start">decision-making, further</text><text x="840" y="1332" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="530" text-anchor="start">testing / transfer, cards consult.</text><rect x="1213" y="1098" width="165" height="34" rx="17" fill="#F8D7D8" stroke="none" stroke-width="1"/><text x="1295.5" y="1121" fill="#B64449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">RULE-IN / TRANSFER</text><text x="1214" y="1158" fill="#B64449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="820" text-anchor="start">2-h delta ≥ 55 ng/L</text><text x="1214" y="1193" fill="#173B61" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">OR repeat total ≥ 90 ng/L</text><path d="M1214 1220h294" stroke="#DDE5ED" stroke-width="1.5"/><text x="1214" y="1251" fill="#B64449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="800" text-anchor="start">TRANSFER</text><text x="1214" y="1281" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">ED transfer or direct admit</text><text x="1214" y="1308" fill="#23374D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="560" text-anchor="start">for ACS / NSTEMI evaluation.</text><rect x="68" y="1390" width="1464" height="57" rx="12" fill="#E9EEF4" stroke="none" stroke-width="1"/><text x="88" y="1414" fill="#3569A2" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="830" text-anchor="start">CLINICAL REFERENCE</text><text x="88" y="1433" fill="#667B90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="540" text-anchor="start">Use the current approved PATHFAST assay-specific protocol. The chart does not replace provider judgment or diagnose MI.</text></svg>