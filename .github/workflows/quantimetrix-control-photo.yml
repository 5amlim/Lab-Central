name: Save manufacturer Quantimetrix Dipper photo
on:
  push:
    paths:
      - .github/workflows/quantimetrix-control-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-control-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Quantimetrix Dipper 1 and 2 photograph
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          from pathlib import Path
          import time
          url="https://quantimetrix.com/wp-content/uploads/Dipper_Tubes_PinkPur.jpg"
          target=Path("assets/quantimetrix-dipper-controls.jpg")
          target.parent.mkdir(parents=True, exist_ok=True)
          for attempt in range(4):
              try:
                  with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40) as response:
                      content=response.read()
                  if not content.startswith(b"\xff\xd8\xff") or len(content)<10000:
                      raise ValueError("Not a manufacturer JPEG")
                  target.write_bytes(content)
                  print("Saved image",len(content))
                  break
              except Exception:
                  if attempt==3:raise
                  time.sleep(4+attempt*2)
          PY
      - name: Commit control photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quantimetrix-dipper-controls.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add manufacturer Quantimetrix Dipper UA controls photo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
