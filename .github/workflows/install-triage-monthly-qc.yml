name: Install exact Triage monthly QC PDF
on:
  push:
    paths:
      - '.github/triage-monthly-payload/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify uploaded PDF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          payload = ''.join((Path('.github/triage-monthly-payload') / ('part%02d.txt' % i)).read_text().strip() for i in range(1, 8))
          pdf = lzma.decompress(base64.b64decode(payload, validate=True))
          expected = '3b9a34b17d1bbcf18f86421e8d7801c32c2bc328fe83cd819e418f03accae003'
          actual = hashlib.sha256(pdf).hexdigest()
          assert actual == expected, 'Uploaded PDF checksum mismatch: ' + actual
          assert pdf.startswith(b'%PDF-'), 'Not a PDF'
          Path('assets/lab-templates/Triage-MeterPro-Control-Log.pdf').write_bytes(pdf)
          print('Exact two-page Triage monthly QC form verified:', len(pdf), 'bytes; SHA256', actual)
          PY
      - name: Commit approved form replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lab-templates/Triage-MeterPro-Control-Log.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Replace Triage monthly QC PDF with approved two-page original'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
