name: Install exact CLINITEK UA and hCG QC log
on:
  push:
    paths:
      - '.github/clinitek-upload.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and install the approved original PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          payload=Path(".github/clinitek-upload.b64").read_text().strip()
          pdf=zlib.decompress(base64.b64decode(payload,validate=True))
          expected="b75f5638a9e9dc27ffd4f55917c664771a16dc26e8da73d917be5131b7ee2854"
          assert hashlib.sha256(pdf).hexdigest()==expected, "Original PDF checksum mismatch"
          assert pdf.startswith(b"%PDF-"), "Unexpected document format"
          dest=Path("assets/lab-templates/CLINITEK-UA-hCG-Control-Log.pdf")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(pdf)
          Path(".github/clinitek-upload.b64").unlink()
          print("Verified and installed exact two-page PDF:",len(pdf),"bytes")
          PY
      - name: Commit PDF replacement and clear transfer payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/lab-templates/CLINITEK-UA-hCG-Control-Log.pdf" .github/clinitek-upload.b64
          if ! git diff --cached --quiet; then
            git commit -m "Install exact two-page CLINITEK UA and hCG QC log"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
