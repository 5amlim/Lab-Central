<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Templates | Lab Central</title>
<style>
:root{color-scheme:light;--navy:#264c61;--teal:#20847d;--muted:#6c8796;--line:#dce8ed;--bg:#f5f9fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.brand{font-size:16px;font-weight:850;letter-spacing:-.02em}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
.actions{display:flex;align-items:center;gap:9px}.btn{appearance:none;border:1px solid #cadde4;background:#fff;border-radius:9px;padding:10px 15px;color:#276b78;font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:#20857d;color:#fff;border-color:#20857d}.btn:hover{filter:brightness(.97)}
.shell{max-width:1220px;margin:26px auto;padding:0 22px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.library{border:1px solid var(--line);border-radius:14px;background:#fff;padding:17px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.library h2{font-size:14px;margin:0 0 5px}.library p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 13px}
.library h3{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#70899a;margin:18px 0 7px}
.library button{display:block;width:100%;border:0;border-radius:8px;background:transparent;text-align:left;font:inherit;color:#48697e;font-size:12px;line-height:1.4;padding:9px 10px;cursor:pointer}
.library button:hover{background:#f1f8f8}.library button.current{background:#e4f3ef;color:#166d65;font-weight:850}
.sheet{background:#fff;border:1px solid #d5e3e8;box-shadow:0 6px 18px #21475a0b;border-radius:14px;padding:30px 32px}
.overline{font-size:10px;letter-spacing:.16em;font-weight:850;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.sheet h1{font-size:27px;margin:0 0 5px;letter-spacing:-.035em;line-height:1.2}
.description{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 17px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0 17px}
.field{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750;color:#47697c;min-height:30px}
.blank{flex:1;min-width:0;display:inline-block;border-bottom:1px solid #a7bdc9;min-height:22px;padding:2px 4px;color:#264c61;font-weight:500;outline-offset:2px}
.instruction{background:#f3f9f9;border-left:3px solid #79bdb1;color:#496e7c;font-size:11px;line-height:1.6;margin:12px 0 16px;padding:9px 12px}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}
th,td{border:1px solid #aabdc6;padding:6px 5px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:#edf5f5;font-weight:850;color:#355b6a}
td{height:22px;outline-offset:-3px}
tr{break-inside:avoid}
td:focus,.blank:focus{background:#fffae6;outline:1px solid #c6a24d}
.sheet-footer{font-size:10px;color:#78909b;margin:16px 0 0;line-height:1.6}
.inline-note{font-size:11px;color:#587989;margin:0 0 14px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.library{position:static;max-height:none}.library-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:14px 16px}}
@media(max-width:550px){.shell{padding:0 10px}.sheet{padding:15px}.sheet h1{font-size:21px}.meta,.library-list{grid-template-columns:1fr}.top{flex-wrap:wrap}.actions{width:100%}.btn{flex:1;text-align:center}}
@page{size:letter landscape;margin:.38in}
@media print{
 body{background:#fff;color:#15252c;font-family:Arial,sans-serif}
 .top,.library,.sheet-footer{display:none!important}
 .shell{display:block;max-width:none;margin:0;padding:0}
 .sheet{padding:0;box-shadow:none;border:0;border-radius:0}
 .sheet h1{font-size:19pt}
 .description{color:#333;font-size:9pt}
 .overline{color:#222}
 .meta{margin:10px 0 12px}
 .blank{border-color:#555}
 .instruction{border-color:#555;background:#fff;padding:5px 9px;color:#333}
 th{background:#f0f0f0!important;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 table{font-size:8pt}
 td{height:18px}
 th,td{padding:4px}
 .sheet{width:100%}
}
</style>
</head>
<body>
<header class="top"><div class="brand">Lab Central / Lab Templates<small>Print-ready blank log sheets adapted from the supplied lab forms</small></div><div class="actions"><a class="btn" href="index.html">Return to Lab Central</a><button type="button" id="print" class="btn primary">Print / Save PDF</button></div></header>
<div class="shell"><aside class="library"><h2>Template Library</h2><p>Select a log, fill optional header fields, then print or save as PDF. Use the approved revision when your site's form differs.</p><div id="library-list" class="library-list"></div></aside><main class="sheet" id="sheet" aria-label="Printable lab template"></main></div>
<script>
'use strict';
const forms=[
 {id:'temperature',group:'daily',title:'Daily Temperature Log',note:'Based on the uploaded BH/SM/MB temperature log examples. Use site-specific ranges and installed-unit columns.',fields:['Month','Year','Location'],headers:['Date','Initials','Lab temperature','Refrigerator 1','Refrigerator 2','Refrigerator 3','Freezer','Humidity'],rows:31,numbered:true},
 {id:'cleaning',group:'daily',title:'Daily Cleaning and Disinfection Log',note:'Record completed cleaning and disinfection per the site SOP.',fields:['Month','Year','Clinic'],headers:['Day','Disinfection completed','Operator initials','Comments / exceptions'],rows:31,numbered:true},
 {id:'sysmex-control',group:'daily',title:'pocH-100i Control Log',originalPdf:'assets/lab-templates/pocH-100i-Control-Log.pdf'},
 {id:'sysmex-blank',group:'daily',title:'pocH-100i Start-up Blank Check Log',originalPdf:'assets/lab-templates/pocH-100i-Start-up-Blank-Check-Log.pdf'},
 {id:'sysmex-maint',group:'daily',title:'pocH-100i Maintenance Log',originalPdf:'assets/lab-templates/pocH-100i-Maintenance-Log.pdf'},
 {id:'triage-daily',group:'daily',title:'Triage MeterPro Daily QC Log',originalPdf:'assets/lab-templates/Triage-MeterPro-Daily-QC-Log.pdf'},
 {id:'clinitek-ua',group:'both',title:'Siemens Urinalysis QC Log',note:'Daily in NorCal, New York and Florida; monthly and event-triggered in SoCal. Record both control levels and lot information.',fields:['Month / Year','Level 1 / Level 2 lots and expirations','Test strip lot and expiration'],headers:['Date / initials','Level 1 (low)','Level 2 (high)','Result','Comments / corrective action'],rows:22,numbered:false},
 {id:'clinitek-hcg',group:'both',title:'Siemens hCG Pregnancy QC Log',note:'Daily in NorCal, New York and Florida; monthly and event-triggered in SoCal. Record both control levels and cassette lot.',fields:['Month / Year','Negative / Positive control lots and expirations','Cassette lot and expiration'],headers:['Date / initials','Level 1 (negative)','Level 2 (positive)','Result','Comments / corrective action'],rows:22,numbered:false},
 {id:'clinitek-maint',group:'daily',title:'Siemens Urinalysis Maintenance Log',note:'Based on the uploaded Siemens maintenance record. Follow site-approved frequencies.',fields:['Month','Year','Instrument serial number'],headers:['Day','Initials','Clean platform','Wipe exterior (as needed)','Clean feed table (as needed)','Check calibration bar (as needed)'],rows:31,numbered:true},
 {id:'eyewash',group:'daily',title:'Eyewash Station Maintenance Log',note:'Uploaded log calls for a daily flow bump test and a weekly three-minute flush.',fields:['Month','Year','Location / station'],headers:['Day','Bump test','Three-minute flush','Initials','Corrective action'],rows:31,numbered:true},
 {id:'waived-qc',group:'monthly',title:'Waived Test Quality Control Log',note:'Event-triggered QC for active waived kits, including new lots/shipments and other approved triggers.',fields:['Date range','Year','Clinic'],headers:['Test name','Lot number','Open date','Expiration','Positive QC','Negative QC','Internal QC','Initials / action'],rows:15,numbered:false},
 {id:'febridx-qc',group:'monthly',title:'FebriDx Quality Control Log',note:'Use for positive and negative external QC on a new kit box and any other SOP-required event.',fields:['Date range','Year','Clinic'],headers:['Date','Kit lot','Expiration','CRP','MxA','Positive IQC','Negative result / IQC','Initials'],rows:15,numbered:false},
 {id:'remedial',group:'monthly',title:'Comprehensive Remedial Action Log',note:'Document problems, alert values, QC failures and specimen rejections, including corrective actions.',fields:['Month','Year','Location'],headers:['Date','Assay / instrument','Problem','Action taken','Corrected Y/N','Initials'],rows:18,numbered:false},
 {id:'pathfast-qc',group:'monthly',title:'PATHFAST Calibration & QC Printout Log (Every 28 Days)',originalPdf:'assets/lab-templates/PATHFAST-Calibration-and-QC-Printout-Log.pdf?v=2-vertical-printouts-20261107'},
 {id:'pathfast-maint',group:'monthly',title:'PATHFAST Operational and Maintenance Schedule (Attachment K)',originalPdf:'assets/lab-templates/PATHFAST-Operational-and-Maintenance-Schedule.pdf'},
 {id:'piccolo-qc',group:'monthly',title:'Piccolo Xpress QC Control Sheet',note:'Document the monthly/panel-SOP low- and high-level QC. Attach corresponding analyzer printouts.',fields:['Study date','Instrument serial number','Control lot number'],headers:['Test panel','Low-level QC result / attachment','High-level QC result / attachment','Operator / signature','Comments / action'],rows:7,numbered:false},
 {id:'triage-liquid',group:'monthly',title:'Triage MeterPro Liquid QC Log',originalPdf:'assets/lab-templates/Triage-MeterPro-Control-Log.pdf'},
 {id:'sofia-cal',group:'monthly',title:'Sofia 2 Calibration Check Log',note:'Calibration checks are documented in this log. No analyzer printout is needed.',fields:['Lab name','Sofia 2 serial number','Month / Year'],headers:['Date','Calibration check result','Cassette lot','Cassette expiration','Technician','Corrective action'],rows:15,numbered:false},
 {id:'sofia-qc',group:'monthly',title:'Sofia 2 QC Log',note:'For external QC associated with new shipments/lots or other IFU triggers. No analyzer printout is needed.',fields:['Facility','Sofia 2 serial number','Kit test / lot / expiration'],headers:['Date','Positive QC','Negative QC','Control lots / expirations','Technician','Comments / action'],rows:15,numbered:false},
 {id:'fire-extinguisher',group:'monthly',title:'Fire Extinguisher Monthly Inspection Log',note:'OPTIONAL: Use only if no approved Facilities, tag or electronic inspection record exists. Verify each extinguisher individually. Record access/mounting, gauge if present (N/A otherwise), pin/seal, visible condition, date, initials and corrective actions. Escalate defects promptly. This monthly visual check is not the annual service.',fields:['Clinic / facility','Month / Year','Facilities contact / reviewer'],headers:['Extinguisher ID / location','Inspection date','Accessible / mounted','Pressure gauge (or N/A)','Pin / tamper seal','Condition / nozzle','Inspector initials','Defect / corrective action / follow-up'],rows:16,numbered:false}
];
const params=new URLSearchParams(location.search);
const requested=params.get('template')||'';
const market=params.get('market')||'';
const clinic=params.get('clinic')||'';
const currentGroup=params.get('view')==='monthly'?'monthly':'daily';
let selected=forms.find(x=>x.id===requested)||forms.find(x=>x.group===currentGroup);
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c]})}
function byGroup(group){return forms.filter(x=>x.group===group||x.group==='both')}
function choose(id){
 const next=forms.find(x=>x.id===id);if(!next)return;
 if(next.originalPdf){location.assign(next.originalPdf);return;}
 selected=next;
 const url=new URL(location.href);url.searchParams.set('template',id);history.replaceState(null,'',url);
 show();
}
function show(){
 const list=document.getElementById('library-list');
 list.innerHTML=['daily','monthly'].map(function(group){
  return '<h3>'+ (group==='daily'?'Daily checks & records':'Monthly & as-needed')+'</h3>'+byGroup(group).map(function(form){
   return '<button type="button" data-template="'+esc(form.id)+'" class="'+(form.id===selected.id?'current':'')+'">'+esc(form.title)+'</button>';
  }).join('');
 }).join('');
 const fields=selected.fields.map(function(f,i){
  const prefill=f==='Location'||f==='Clinic'?clinic:(f==='Lab name'||f==='Facility'?clinic:'');
  return '<label class="field">'+esc(f)+'<span class="blank" contenteditable="true" spellcheck="false" role="textbox" aria-label="'+esc(f)+'">'+esc(prefill)+'</span></label>';
 }).join('');
 const rows=Array.from({length:selected.rows},function(_,i){
  return '<tr>'+selected.headers.map(function(h,j){
   return '<td contenteditable="'+(selected.numbered&&j===0?'false':'true')+'" spellcheck="false">'+(selected.numbered&&j===0?i+1:'')+'</td>';
  }).join('')+'</tr>';
 }).join('');
 document.getElementById('sheet').innerHTML=
  '<div class="overline">Lab Central / '+esc(market||'All markets')+' / '+esc(selected.group==='monthly'?'Recurring records':selected.group==='daily'?'Daily records':'QC records')+'</div>'+
  '<h1>'+esc(selected.title)+'</h1>'+
  '<p class="description">Blank, print-ready template based on the log sheets supplied for Lab Central.</p>'+
  '<div class="meta">'+fields+'</div>'+
  '<p class="instruction">'+esc(selected.note)+'</p>'+
  '<table aria-label="'+esc(selected.title)+'"><thead><tr>'+selected.headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'+
  '<p class="sheet-footer">Use only with the current approved site SOP and document-control process. This is a printable adaptation, not a replacement for a controlled original form.</p>';
 document.title=selected.title+' | Lab Central';
}
document.addEventListener('click',function(e){const b=e.target.closest('[data-template]');if(b)choose(b.dataset.template)});
document.getElementById('print').addEventListener('click',function(){window.print()});
if(selected.originalPdf)location.replace(selected.originalPdf);else show();
</script>
</body>
</html>
