<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sollis Lab | Printable Stool & Urine Collection Instructions</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#263d54;background:#f4f7fa}
*{box-sizing:border-box}body{margin:0}.toolbar{background:#fff;border-bottom:1px solid #e1e8f0;padding:18px max(20px,calc((100vw - 960px)/2));position:sticky;top:0;z-index:2}
.toolbar-main{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar b{display:block;font-size:17px}.toolbar small{color:#718194}.chooser{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chooser button,.print-button{font-family:inherit;border:1px solid #cfdae5;border-radius:9px;background:#f8fafc;padding:10px 12px;color:#35516c;font-size:12px;font-weight:700;cursor:pointer}
.chooser button[aria-pressed=true]{background:#e5f4f1;color:#167268;border-color:#8ac8bf}.print-button{background:#147e7a;color:white;border-color:#147e7a;font-size:13px}
main{max-width:920px;margin:30px auto;padding:0 15px 35px}.sheet{background:#fff;border:1px solid #e0e7ef;border-radius:15px;box-shadow:0 6px 24px #29354c10;padding:32px 38px}.letterhead{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:2px solid #147f7b;padding-bottom:18px}
.brand{font-size:12px;letter-spacing:.16em;font-weight:850;color:#127e79}.kind{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em;color:#648097;text-align:right}
h1{font-size:27px;line-height:1.15;margin:23px 0 8px;letter-spacing:-.045em} .intro{font-size:13px;line-height:1.6;color:#5c6f83;margin:0 0 15px}.kit{background:#eaf6f4;border:1px solid #cbe6e1;border-radius:11px;padding:12px 16px;font-size:13px;margin:14px 0 20px}.kit strong{color:#177a74}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step{display:flex;gap:13px;border:1px solid #dfebf2;border-radius:12px;padding:12px;min-height:151px;break-inside:avoid;background:#fcfdff}
.step-picture{width:128px;min-width:128px;height:112px;align-self:center;background:#f3f8fb;border-radius:10px;display:grid;place-items:center}.step-picture svg{width:100%;height:auto;max-height:112px}.step-body{flex:1;min-width:0}.step-no{display:inline-block;color:#17847c;font-size:10px;font-weight:850;letter-spacing:.12em;margin:3px 0 6px}
.step h2{font-size:14px;line-height:1.24;margin:0 0 6px}.step p{font-size:12px;line-height:1.48;margin:0;color:#4f6577}
.warning{background:#fff6ea;color:#775320;border:1px solid #ebd6b6;padding:11px 14px;border-radius:10px;margin:16px 0 0;font-size:12px;line-height:1.55}
.return{margin:18px 0 0;border:2px solid #b8dad5;border-radius:14px;display:flex;gap:15px;padding:16px;align-items:center;break-inside:avoid}.return-picture{width:110px;flex:none}.return-picture svg{width:100%}.return h2{font-size:16px;margin:0 0 5px}.return p{font-size:12px;line-height:1.55;color:#456274;margin:0}
.footer{border-top:1px solid #e2e8ee;margin-top:18px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;color:#6c7e8d;font-size:10px}.footer strong{color:#334c62}
@media(max-width:720px){.sheet{padding:20px}.steps{grid-template-columns:1fr}.step-picture{width:115px;min-width:115px}.toolbar{position:static}.footer{flex-direction:column;align-items:flex-start}}
@page{size:letter;margin:.45in}
@media print{html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none!important}main{padding:0;margin:0;max-width:none}.sheet{border:0;box-shadow:none;border-radius:0;padding:0}.letterhead{padding-bottom:10px}h1{font-size:23px;margin:14px 0 6px}.intro{font-size:11px;margin-bottom:10px}.kit{margin:8px 0 12px;padding:8px 11px;font-size:11px}.steps{gap:9px}.step{padding:9px;min-height:126px}.step-picture{min-width:100px;width:100px;height:92px}.step-picture svg{max-height:92px}.step h2{font-size:12px;margin-bottom:5px}.step p{font-size:10px;line-height:1.35}.step-no{margin:2px 0 4px;font-size:9px}.warning{margin-top:12px;padding:8px 11px;font-size:10px}.return{margin-top:11px;padding:10px}.return-picture{width:80px}.return h2{font-size:13px}.return p{font-size:10px}.footer{margin-top:10px;padding-top:8px}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-main"><div><b>Printable patient collection guides</b><small>Choose the exact kit given to the patient.</small></div><button id="print" class="print-button" type="button">Print selected guide</button></div>
  <nav class="chooser" id="chooser" aria-label="Choose patient handout"></nav>
</div>
<main id="content"></main>
<script>
(function(){
"use strict";
const guides=[
{id:"biofire-stool",short:"BioFire stool",title:"Stool collection · BioFire GI panel",kit:"Orange-lid Para-Pak C&S / Cary-Blair vial",intro:"Use the orange-lid transport vial supplied by the clinic for the in-house BioFire gastrointestinal test.",warning:"This vial contains transport liquid. Do not pour it out. Add stool only up to the marked fill line. The BioFire GI test requires stool in Cary-Blair medium.",steps:[
["Before you collect","Urinate first. Place the collection hat under the back of the toilet seat. Keep urine, water and toilet paper out of the stool.","hat"],
["Add the stool","Open the orange-lid vial. Use the scoop attached to the lid or the supplied tongue depressor to add stool up to the marked fill line.","orange"],
["Close and mix","Close the lid tightly. Mix the sample with the liquid as instructed on the supplied vial label; keep the vial upright and do not spill.","orange-seal"],
["Label the vial","Write the collection date and time. Make sure your full name and date of birth are on the vial itself, not only the bag.","label"],
["Bag the specimen","Put the sealed vial in the biohazard bag, then place that bag inside the opaque outer bag.","bag"]
]},
{id:"pathmd-stool",short:"PathMD stool",title:"Stool collection · PathMD GI panel",kit:"PathMD white-top transport tube + thick swab",intro:"Use the white-top PathMD transport tube and the thick swab provided with your kit. This is not a BioFire Para-Pak collection.",warning:"Keep any liquid already inside the tube. Do not pour it out. Do not use a urine pipette. Use the correct PathMD kit for the test ordered.",steps:[
["Collect stool in the hat","Urinate first. Collect stool in the clean collection hat without mixing it with toilet water, urine or paper.","hat"],
["Collect with the thick swab","Open the swab without touching the tip. Pick up a visible amount of stool on the swab tip.","stool-swab"],
["Place swab into white-top tube","Put the stool-coated swab into the PathMD white-top tube, following the kit's break-point directions if applicable. Close securely.","white-tube"],
["Label the tube","Add your full name, date of birth, specimen source, and the date and time you collected it. Do not cover any barcode.","label"],
["Double bag","Put the sealed tube in its biohazard bag, then inside the supplied opaque bag. Do not include the collection hat.","bag"]
]},
{id:"cedars-stool",short:"Cedars stool",title:"Stool collection · Cedars",kit:"The specific Cedars stool vials supplied for your ordered test",intro:"Cedars uses different stool containers for different orders. Follow the labels and the clinic's markings on the specific vials you received.",warning:"Some vials contain different preservatives. Never mix liquids between containers, pour the preservative out or assume all tests need all three vials. Contact the clinic if you are unsure which vials to fill.",steps:[
["Prepare collection hat","Urinate first, then collect stool in the hat. Do not let urine, toilet water or toilet paper touch the specimen.","hat"],
["Check the selected vials","Use only the Cedars stool containers the clinic instructed you to fill. A kit may include more than one vial or an unpreserved cup.","vials"],
["Add stool to marked line","Use the scoop in each lid or the supplied tongue depressor. Follow each specific vial's fill marking; do not overfill.","vials-fill"],
["Seal and label each vial","Close every filled vial tightly. Put your name, date of birth, collection date and time on each container.","label"],
["Bag all requested containers","Place closed containers together in the provided biohazard bag, then inside the opaque outer bag.","bag"]
]},
{id:"pathmd-urine",short:"PathMD urine",title:"Urine collection · PathMD UTI panel",kit:"Sterile urine cup + thick swab + PathMD white-top tube",intro:"For the PathMD urinary pathogen panel, use a clean-catch urine specimen if your clinic instructed that method. Then use the thick swab and white-top transport tube.",warning:"For this PathMD white-top swab workflow, do not use the old HealthTrackRx-style urine pipette. Other PathMD tests may require a different specimen source, so follow the order-specific instructions.",steps:[
["Clean before collecting","Wash hands. Clean around the urethral opening with the supplied wipes. Put used wipes in the trash, not the toilet.","wipe"],
["Collect urine","Start urinating into the toilet, then collect urine in the sterile cup without touching the rim or inside. Your clinic may instruct first-catch urine for other orders.","urine"],
["Mix using the thick swab","Put the thick swab tip into urine in the cup and stir 10 times. Do not use a transfer pipette for the white-top swab workflow.","mix"],
["Place in white-top tube","Put the urine-exposed swab into the PathMD white-top tube and seal it. Leave the tube's transport medium in place.","white-tube"],
["Label and bag","Label the tube with your name, date of birth, specimen source, date and time. Seal it in the biohazard bag, then the opaque bag.","bag"]
]},
{id:"cedars-urine",short:"Cedars urine",title:"Urine collection · Cedars",kit:"Sterile cup and any clinic-issued Cedars test-specific transfer tubes",intro:"Collect using the method specified for your test. Clean-catch and first-catch urine are not interchangeable, so verify the clinic's instructions.",warning:"Some Cedars urine transfer cups and straws contain a concealed needle. Use these only if the clinic has instructed and trained you. Never reach into the transfer port or remove internal needle components. Different tests require different tubes and fill amounts.",steps:[
["Clean and collect","Wash hands, clean with the supplied wipes, and collect urine into the sterile cup using the collection method your clinic specified.","wipe"],
["Avoid touching inside","Do not touch the cup interior or inside of the cap. Close the cup securely as soon as you finish collecting.","urine"],
["Use only assigned tubes","If staff trained you to use the integrated transfer lid or straw, keep the cup upright and insert each assigned tube stopper into the protected port until filling stops.","transfer"],
["Check the fill and labels","Fill the exact tubes listed for your order, following their required marks. Label each tube with your name, date of birth and collection date/time.","label"],
["Package for return","Seal each tube in the biohazard bag and then the opaque bag. Call the clinic if transfer or collection was difficult.","bag"]
]},
{id:"dropoff",short:"Specimen drop-off",title:"Returning your stool or urine specimen",kit:"Sealed and labeled collection container + biohazard bag + opaque bag",intro:"These instructions apply after you collect your stool or urine using the kit selected by the clinic.",warning:"Specimen acceptance, preservation and storage times depend on the test and container. Do not assume an overnight or room-temperature hold is acceptable. Call the clinic for instructions if you cannot return it the same day.",steps:[
["Check the label","Confirm your full name, date of birth, and collection date/time are on each specimen container.","label"],
["Check the cap","Make sure the collection tube or vial is tightly sealed. Keep transport liquid in place.","white-tube"],
["Bag the specimen","Put the container in the biohazard bag, then inside an opaque outer bag. Keep paperwork outside any leak-prone specimen compartment.","bag"],
["Return promptly","Call the clinic to coordinate a drop-off and bring the specimen the same day when possible. Do not leave it unattended.","clinic"],
["Hand it to clinic staff","Tell staff the collection date/time and whether the container was refrigerated. Staff will arrange the Athena drop-off encounter and appropriate order.","handoff"]
]}
];
function picture(kind){
const txt=(x,y,s,n=10,color="#4b6275")=>'<text x="'+x+'" y="'+y+'" font-family="Arial,sans-serif" font-size="'+n+'" font-weight="700" fill="'+color+'">'+s+'</text>';
const cup='<rect x="36" y="34" width="70" height="61" rx="7" fill="#fff" stroke="#93aabe" stroke-width="3"/><path d="M31 30h80" stroke="#90a9bc" stroke-width="7" stroke-linecap="round"/>';
const vial=(x,color,fill)=>'<rect x="'+x+'" y="38" width="29" height="60" rx="6" fill="#fff" stroke="#8da7b6" stroke-width="2"/><rect x="'+(x-2)+'" y="27" width="33" height="16" rx="4" fill="'+color+'"/>'+(fill?'<rect x="'+(x+3)+'" y="65" width="23" height="29" rx="3" fill="'+fill+'" opacity=".7"/>':'');
let b='';
switch(kind){
case 'hat':b='<path d="M12 31h118l-17 64H29z" fill="#fff" stroke="#8cabbc" stroke-width="3"/><path d="M28 50h87l-10 35H37z" fill="#e6f1f5"/><path d="M41 71q6-17 18-7t17 2q13-13 27 8v11H41z" fill="#a77d5f"/>'+txt(28,117,'COLLECTION HAT');break;
case 'orange':case 'orange-seal':b=vial(51,"#e89c37","#e8a48c")+'<path d="M60 73h12" stroke="#9c4e3c" stroke-width="2"/>'+txt(34,116,'TO FILL LINE');if(kind==='orange-seal')b+='<path d="m88 69 10 10 18-24" stroke="#0f857c" stroke-width="5" fill="none"/>';break;
case 'stool-swab':b=cup+'<path d="m44 15 59 62" stroke="#a88d6c" stroke-width="5" stroke-linecap="round"/><ellipse cx="102" cy="78" rx="8" ry="12" fill="#a47a59" stroke="#815d43" stroke-width="2" transform="rotate(-42 102 78)"/>'+txt(30,116,'THICK SWAB');break;
case 'white-tube':b=vial(53,"#f5f7fa","#d6e8e6")+'<path d="M67 12v66" stroke="#a28d72" stroke-width="4"/><ellipse cx="67" cy="78" rx="6" ry="9" fill="#ad8771"/>'+txt(22,116,'WHITE-TOP TUBE');break;
case 'vials':case 'vials-fill':b=vial(17,"#f1c95d","#eee5ad")+vial(55,"#e7b1c8","#efccdb")+vial(93,"#eff4f7","#eaf2f5");if(kind==='vials-fill')b+='<path d="M18 78h102" stroke="#c17e66" stroke-width="2" stroke-dasharray="4 4"/>';break;
case 'wipe':b='<rect x="29" y="30" width="85" height="69" rx="9" fill="#fff" stroke="#9bb8bf" stroke-width="3"/><path d="m37 75 26-27 28 26 17-18" stroke="#83beb7" stroke-width="6" fill="none"/>'+txt(38,116,'CLEANSE');break;
case 'urine':b=cup+'<path d="M40 65h62v24H40z" fill="#e6be63" opacity=".75"/>'+txt(24,116,'STERILE CUP');break;
case 'mix':b=cup+'<path d="m56 12 25 64" stroke="#997f64" stroke-width="5"/><ellipse cx="81" cy="75" rx="6" ry="7" fill="#f4f4eb" stroke="#9ab4ba"/><path d="M111 55q21 18 0 38" stroke="#138a80" stroke-width="3" fill="none"/>'+txt(105,45,'×10',13,"#138a80");break;
case 'transfer':b=cup+'<rect x="62" y="27" width="20" height="65" rx="5" fill="#fff" stroke="#94abb5" stroke-width="2"/><rect x="58" y="20" width="28" height="13" rx="3" fill="#99969a"/><path d="M28 15l14 15" stroke="#d69b50" stroke-width="5"/>'+txt(20,116,'PROTECTED PORT');break;
case 'label':b=vial(55,"#f1f4f7","#e0eef0")+'<rect x="55" y="57" width="29" height="35" fill="#fff" stroke="#afc2cc"/><path d="M60 64h20m-20 7h17m-17 7h20" stroke="#859caa" stroke-width="2"/>'+txt(31,116,'NAME + DATE');break;
case 'bag':b='<path d="M24 28h95v72H24z" fill="#e4f5ed" stroke="#93b7b1" stroke-width="3"/><path d="M24 40h95" stroke="#75a39d" stroke-width="4"/>'+vial(57,"#f2f4f6","#d6e3e8")+txt(33,117,'BIOHAZARD BAG');break;
case 'clinic':b='<path d="M20 61 71 21l51 40v51H20z" fill="#e0f2f1" stroke="#82b5b2" stroke-width="3"/><rect x="54" y="73" width="35" height="39" fill="#fff" stroke="#79a6a4"/><path d="M71 31v26m-13-13h26" stroke="#159486" stroke-width="6"/>'+txt(30,127,'CLINIC RETURN');break;
case 'handoff':b='<rect x="24" y="51" width="38" height="47" rx="5" fill="#e1f4f1" stroke="#93b6b1"/><rect x="79" y="51" width="38" height="47" rx="5" fill="#e1f4f1" stroke="#93b6b1"/><path d="M62 72h17" stroke="#19847c" stroke-width="4"/><path d="m72 63 9 9-9 9" stroke="#19847c" stroke-width="3" fill="none"/>'+txt(22,118,'HAND TO STAFF');break;
}
return '<svg viewBox="0 0 145 135" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+b+'</svg>';
}
const params=new URLSearchParams(location.search);
let chosen=guides.find(g=>g.id===params.get("guide"))||guides[0];
const choice=document.getElementById("chooser"),content=document.getElementById("content");
function draw(){
 choice.innerHTML=guides.map(g=>'<button type="button" data-guide="'+g.id+'" aria-pressed="'+(g.id===chosen.id)+'">'+g.short+'</button>').join('');
 const steps=chosen.steps.map((s,i)=>'<article class="step"><div class="step-picture">'+picture(s[2])+'</div><div class="step-body"><span class="step-no">STEP '+String(i+1).padStart(2,"0")+'</span><h2>'+s[0]+'</h2><p>'+s[1]+'</p></div></article>').join('');
 const drop=chosen.id==="dropoff"?"Call your clinic to coordinate drop-off. Clinic staff will create the Athena drop-off encounter and confirm a new provider order.":
  "Return to your clinic the same day whenever possible. Call ahead to coordinate the drop-off. Clinic staff will create the Athena drop-off encounter and arrange the necessary provider order.";
 content.innerHTML='<article class="sheet"><header class="letterhead"><div class="brand">SOLLIS HEALTH · LAB</div><div class="kind">PATIENT INSTRUCTIONS<br>STOOL / URINE COLLECTION</div></header>'+
  '<h1>'+chosen.title+'</h1><p class="intro">'+chosen.intro+'</p><div class="kit"><strong>YOUR KIT:</strong> '+chosen.kit+'</div>'+
  '<section class="steps" aria-label="Collection instructions">'+steps+'</section>'+
  '<div class="warning"><strong>Important:</strong> '+chosen.warning+'</div>'+
  '<aside class="return"><div class="return-picture">'+picture("clinic")+'</div><div><h2>How to drop off your specimen</h2><p>'+drop+' Keep the specimen in its designated container, labeled with your full name, date of birth, and collection date/time. Do not leave the specimen at the clinic without handing it to staff.</p></div></aside>'+
  '<footer class="footer"><span>Questions? Call your clinic and ask for a nurse. Main number: <strong>310-870-0400</strong>.</span><span>Verify any special storage instructions with the clinic. · 11/2026</span></footer></article>';
 document.title='Sollis Patient Instructions | '+chosen.short;
}
choice.addEventListener('click',function(e){const button=e.target.closest('[data-guide]');if(!button)return;const selected=guides.find(g=>g.id===button.dataset.guide);if(!selected)return;chosen=selected;history.replaceState(null,'','?guide='+encodeURIComponent(chosen.id));draw();});
document.getElementById('print').addEventListener('click',()=>window.print());
draw();
})();
</script>
</body>
</html>
