<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sollis Lab | Printable Stool & Urine Collection Instructions</title>
<style>

:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#263d54;background:#f3f7f9}
*{box-sizing:border-box}
body{margin:0}
.toolbar{position:relative;z-index:2;background:#fff;border-bottom:1px solid #e2eaf0;padding:18px max(22px,calc((100vw - 900px)/2))}
.toolbar-main{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.toolbar b{display:block;font-size:16px;letter-spacing:-.015em}
.toolbar small{display:block;color:#6b8092;font-size:12px;margin-top:4px}
.chooser{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chooser button,.print-button{font:inherit;font-size:12px;font-weight:720;cursor:pointer;border-radius:8px;transition:background .15s,border-color .15s}
.chooser button{background:#f9fbfd;color:#39556e;border:1px solid #d6e1e9;padding:9px 13px}
.chooser button[aria-pressed=true]{background:#e8f5f2;border-color:#75b7ae;color:#0f7770}
.chooser button:hover{background:#edf5f7}
.chooser button:focus-visible,.print-button:focus-visible{outline:3px solid #81c7c0;outline-offset:2px}
.print-button{border:1px solid #147e79;background:#147e79;color:#fff;padding:11px 17px}
.print-button:hover{background:#096d68}
main{width:min(100% - 32px,800px);margin:24px auto 45px}
.sheet{background:#fff;padding:36px 46px 31px;border:1px solid #e2eaf0;border-radius:12px;box-shadow:0 12px 32px #1a38500b}
.letterhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:14px;border-bottom:2px solid #167d78}
.brand{font-size:11px;font-weight:850;letter-spacing:.15em;color:#147c79}
.kind{font-size:10px;text-align:right;letter-spacing:.1em;font-weight:850;color:#637d8e}
.section-kicker{font-size:10px;letter-spacing:.13em;color:#177e78;font-weight:850;margin-top:23px;text-transform:uppercase}
h1{font-size:clamp(24px,3vw,31px);line-height:1.15;letter-spacing:-.035em;color:#253a52;margin:8px 0}
.intro{font-size:13px;line-height:1.55;color:#5e7487;margin:0 0 17px}
.kit{display:flex;align-items:flex-start;gap:13px;padding:12px 15px;border:1px solid #cde5e1;background:#f2faf8;border-radius:9px;font-size:12px;line-height:1.55;color:#3b6170;margin-bottom:23px}
.kit strong{flex:0 0 116px;font-size:10px;letter-spacing:.08em;color:#187e79}
.steps-title{font-size:13px;color:#274357;font-weight:850;margin:0 0 9px}
.steps{display:flex;flex-direction:column;border-top:1px solid #e0eaf0}
.step{display:grid;grid-template-columns:38px minmax(0,1fr) 86px;align-items:center;gap:17px;padding:13px 6px 13px 1px;border-bottom:1px solid #e2eaf0;break-inside:avoid;page-break-inside:avoid;min-height:101px}
.step-no{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid #b7ddd7;color:#13807a;background:#ecf7f4;font-size:13px;font-weight:850}
.step-body h2{font-size:15px;margin:0 0 4px;color:#263d54;line-height:1.3;letter-spacing:-.01em}
.step-body p{font-size:12px;line-height:1.52;margin:0;color:#587183}
.step-picture{height:79px;width:86px;display:grid;place-items:center;background:#f5f9fb;border:1px solid #edf2f6;border-radius:9px}
.step-picture svg{width:84px;height:76px;display:block}
.return{display:flex;align-items:center;gap:13px;margin:17px 0 0;background:#ecf7f4;border:1px solid #c8e4de;border-radius:10px;padding:13px 14px;break-inside:avoid;page-break-inside:avoid}
.return-picture{width:58px;flex:0 0 58px}
.return-picture svg{display:block;width:58px;height:58px}
.return h2{font-size:14px;color:#176f69;margin:0 0 3px}
.return p{font-size:11.5px;line-height:1.48;color:#466b70;margin:0}
.warning{margin-top:15px;padding:11px 13px;border-radius:9px;background:#fffaef;border:1px solid #eddcba;color:#73531c;font-size:11.5px;line-height:1.5;break-inside:avoid}
.warning strong{color:#77501a}
.footer{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-top:1px solid #dfe8ee;margin-top:22px;padding-top:11px;font-size:10.5px;line-height:1.5;color:#647a89}
.footer strong{color:#29495c}
.footer .footer-meta{text-align:right;font-size:9px}
@media(max-width:640px){
 .sheet{padding:24px 20px}
 .toolbar{padding:16px}
 .step{grid-template-columns:32px minmax(0,1fr) 70px;gap:10px}
 .step-picture{width:70px;height:68px}
 .step-picture svg{width:68px;height:65px}
 .step-body h2{font-size:13px}
 .step-body p{font-size:11px}
 .kit{display:block}
 .kit strong{display:block;margin-bottom:3px}
 .footer{align-items:flex-start;flex-direction:column}
 .footer .footer-meta{text-align:left}
}
@page{size:letter;margin:.5in}
@media print{
 html,body{background:#fff!important;color:#1d3046!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .toolbar{display:none!important}
 main{width:100%;max-width:none;margin:0;padding:0}
 .sheet{border:0;border-radius:0;box-shadow:none;padding:0}
 .letterhead{padding-bottom:9px}
 .section-kicker{margin-top:13px;font-size:9px}
 h1{font-size:23px;margin:6px 0 5px}
 .intro{font-size:11px;line-height:1.4;margin:0 0 9px}
 .kit{margin-bottom:12px;padding:8px 10px;font-size:10px}
 .steps-title{font-size:11px;margin-bottom:4px}
 .step{grid-template-columns:27px minmax(0,1fr) 70px;gap:9px;padding:8px 4px 8px 0;min-height:74px}
 .step-no{width:26px;height:26px;font-size:10px}
 .step-body h2{font-size:11.7px;line-height:1.25;margin:0 0 2px}
 .step-body p{font-size:9.6px;line-height:1.4}
 .step-picture{width:66px;height:62px}
 .step-picture svg{width:66px;height:61px}
 .return{margin:12px 0 0;padding:9px 11px;gap:10px}
 .return-picture,.return-picture svg{width:46px;height:46px;flex-basis:46px}
 .return h2{font-size:11px}
 .return p{font-size:9.5px}
 .warning{margin-top:10px;padding:8px 10px;font-size:9.5px}
 .footer{margin-top:14px;padding-top:8px;font-size:9px}
 .footer .footer-meta{font-size:8px}
}


/* Cedars patient guide chooser: deliberately separate culture vs UA tubes. */
.cedars-choice-intro{font-size:13px;line-height:1.55;color:#5d7485;margin:0 0 17px}
.cedars-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:17px 0 22px}
.cedars-choice{border:1.5px solid #cfdee6;background:#fff;border-radius:13px;padding:19px;display:flex;flex-direction:column;gap:7px;min-width:0}
.cedars-choice-visual{height:156px;display:grid;place-items:center;background:#f5f9fa;border-radius:10px;margin:0 0 6px}
.cedars-choice-visual svg{width:156px;height:145px;max-width:100%}
.cedars-choice-tag{color:#187f78;letter-spacing:.10em;font-size:10px;font-weight:850}
.cedars-choice h2{color:#233f54;font-size:18px;line-height:1.3;margin:0}
.cedars-choice p{color:#587082;font-size:12px;line-height:1.55;margin:0 0 7px;flex:1}
.cedars-choice button{padding:11px 13px;cursor:pointer;font:inherit;font-size:12px;font-weight:800;color:#fff;background:#167d78;border:1px solid #167d78;border-radius:8px;text-align:center}
.cedars-choice button:focus-visible,.cedars-back:focus-visible{outline:3px solid #69b3ad;outline-offset:2px}
.cedars-back{margin:0 0 16px;font:inherit;background:#f2f8fa;border:1px solid #d2e0e8;color:#31566f;border-radius:8px;padding:9px 12px;font-size:11px;font-weight:750;cursor:pointer}
.cedars-kit-id{margin:0 0 15px;padding:10px 13px;border:1px solid #cde5e1;border-radius:10px;background:#f3faf8;display:flex;align-items:center;gap:14px}
.cedars-kit-id svg{width:102px;height:91px;flex:0 0 102px}
.cedars-kit-id strong{display:block;font-size:12px;color:#217b75;margin-bottom:4px}
.cedars-kit-id span{font-size:11px;color:#536e7d;line-height:1.45}
@media(max-width:640px){.cedars-choice-grid{grid-template-columns:1fr}.cedars-choice-visual{height:124px}.cedars-choice-visual svg{height:120px}}
@media print{.cedars-choice-grid,.cedars-back{display:none!important}.cedars-kit-id{padding:7px 11px;margin:0 0 8px}.cedars-kit-id svg{width:62px;height:57px;flex-basis:62px}}

</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-main"><div><b>Printable patient collection guides</b><small>Choose the exact kit given to the patient.</small></div><button id="print" class="print-button" type="button">Print selected guide</button></div>
  <nav class="chooser" id="chooser" aria-label="Choose patient handout"></nav>
</div>
<main id="content"></main>
<script>
(function(){
"use strict";
const guides=[
{id:"biofire-stool",short:"BioFire stool",title:"Stool collection · BioFire GI panel",kit:"Orange-lid Para-Pak C&S / Cary-Blair vial",intro:"Use the orange-lid transport vial supplied by the clinic for the in-house BioFire gastrointestinal test.",warning:"This vial contains transport liquid. Do not pour it out. Add stool only up to the marked fill line. The BioFire GI test requires stool in Cary-Blair medium.",steps:[

["Close and mix","Close the lid tightly. Mix the sample with the liquid as instructed on the supplied vial label; keep the vial upright and do not spill.","orange-seal"],
["Label the vial","Write the collection date and time. Make sure your full name and date of birth are on the vial itself, not only the bag.","label"],
["Bag the specimen","Put the sealed vial in the biohazard bag, then place that bag inside the external bag provided.","bag"]
]},
{id:"pathmd-stool",short:"PathMD stool",title:"Stool collection · PathMD GI panel",kit:"PathMD white-top transport tube + thick swab",intro:"Use the white-top PathMD transport tube and the thick swab provided with your kit. This is not a BioFire Para-Pak collection.",warning:"Keep any liquid already inside the tube. Do not pour it out. Do not use a urine pipette. Use the correct PathMD kit for the test ordered.",steps:[
["Collect stool in the hat","Urinate first. Collect stool in the clean collection hat without mixing it with toilet water, urine or paper.","hat"],
["Collect with the thick swab","Open the swab without touching the tip. Pick up a visible amount of stool on the swab tip.","stool-swab"],
["Place swab into white-top tube","Put the stool-coated swab into the PathMD white-top tube, following the kit's break-point directions if applicable. Close securely.","white-tube"],
["Label the tube","Add your full name, date of birth, specimen source, and the date and time you collected it. Do not cover any barcode.","label"],
["Double bag","Put the sealed tube in its biohazard bag, then in the external bag provided. Do not include the collection hat.","bag"]
]},
{id:"cedars-stool",short:"Cedars stool",title:"Stool collection · Cedars",kit:"The specific Cedars stool vials supplied for your ordered test",intro:"Cedars uses different stool containers for different orders. Follow the labels and the clinic's markings on the specific vials you received.",warning:"Some vials contain different preservatives. Never mix liquids between containers, pour the preservative out or assume all tests need all three vials. Contact the clinic if you are unsure which vials to fill.",steps:[
["Prepare collection hat","Urinate first, then collect stool in the hat. Do not let urine, toilet water or toilet paper touch the specimen.","hat"],
["Check the selected vials","Use only the Cedars stool containers the clinic instructed you to fill. A kit may include more than one vial or an unpreserved cup.","vials"],

]},
{id:"pathmd-urine",short:"PathMD urine",title:"Urine collection · PathMD UTI panel",kit:"Sterile urine cup + thick swab + PathMD white-top tube",intro:"For the PathMD urinary pathogen panel, use a clean-catch urine specimen if your clinic instructed that method. Then use the thick swab and white-top transport tube.",warning:"For this PathMD white-top swab workflow, use the thick swab, not a transfer pipette. Other PathMD tests may require a different specimen source, so follow the order-specific instructions.",steps:[
["Clean before collecting","Wash hands. Clean around the urethral opening with the supplied wipes. Put used wipes in the trash, not the toilet.","wipe"],

["Label and bag","Label the tube with your name, date of birth, specimen source, date and time. Seal it in the biohazard bag, then in the external bag provided.","bag"]

{id:"cedars-urine",short:"Cedars urine",title:"Urine collection · Cedars",kit:"Choose the collection tube that matches the ordered urine test",intro:"Cedars uses different preservative tubes for urinalysis and urine culture. Select the test below so the correct tube and instructions appear.",steps:[]},
{id:"cedars-urine-culture",subguide:true,short:"Cedars urine culture",title:"Urine culture · Cedars (gray-top tube)",kit:"Sterile urine cup + GRAY-top C&S preservative tube (4 mL, BD REF 364951)",intro:"Use the gray-top preservative tube for urine culture only when your clinic provided and instructed you to use this kit. Do not substitute the red/yellow urinalysis tube.",warning:"Urine culture and urinalysis tubes are different. Some collection lids and transfer straws contain a concealed needle. Only transfer urine if clinic staff demonstrated the device; otherwise keep the sterile cup sealed and contact the clinic for transfer instructions. Never handle an exposed needle.",steps:[
["Collect urine in the sterile cup","Wash hands, clean as directed, then collect the urine specimen using the method specified by the clinic. Keep the inside of the cup and cap clean.","urine"],

]},
{id:"cedars-urine-ua",subguide:true,short:"Cedars urinalysis",title:"Urinalysis (UA) · Cedars (red/yellow swirl-top tube)",kit:"Sterile urine cup + RED/YELLOW SWIRL-top UA preservative tube (8 mL, BD REF 364992)",intro:"Use the red/yellow swirled-cap urinalysis preservative tube for the ordered UA test. This longer tube has a tapered bottom and is not the gray urine-culture tube.",warning:"Do not substitute the gray-top culture tube for a UA preservative tube. Some collection lids and transfer straws contain a concealed needle. Only transfer urine if clinic staff demonstrated the device; otherwise keep the sterile cup sealed and contact the clinic for instructions.",steps:[

["Transfer urine if instructed","If trained, use the supplied protected transfer port or straw. Keep the tube in position until urine flow stops. Do not touch the concealed needle.","cedars-transfer-ua"],
["Check fill and invert 8–10 times","Confirm urine is between the tube's MIN and MAX fill marks. Invert the UA preservative tube 8–10 times to mix after filling.","cedars-invert-ua"],
["Label, seal and bag","Label the tube with full name, date of birth and collection date/time. Place it in the biohazard bag, then in the external bag provided.","bag"]
]},
{id:"dropoff",short:"Specimen drop-off",title:"Returning your stool or urine specimen",kit:"Sealed specimen container, biohazard bag and external bag provided",intro:"Before bringing a specimen to the clinic, complete these four checks. Follow the collection guide for your specific test and container.",warning:"Storage and time limits depend on the test. If you cannot return your sample the same day, call the clinic first for exact instructions. Do not assume room-temperature or overnight storage is acceptable.",steps:[

// Illustrated specimens are schematic references based on the stocked tube design.

function handoutTxt(x,y,label,size=8,color='#465f75',weight=750){
 return '<text x="'+x+'" y="'+y+'" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="'+size+'" font-weight="'+weight+'" fill="'+color+'">'+label+'</text>';
}
function renderParaPak(sealed){
 let grooves='';
 for(let x=45;x<=104;x+=5)grooves+='<path d="M'+x+' 21v16" stroke="#d86d28" stroke-width="1.6"/>';
 return '<path d="M47 37h54v81q-27 12-54 0z" fill="#edf3f5" stroke="#88a6b5" stroke-width="2.2"/>'+
  '<path d="M50 92h48v26q-24 6-48 0z" fill="#be7889" opacity=".62"/>'+
  '<rect x="49" y="44" width="50" height="52" rx="2" fill="#fff8ef" stroke="#d9e0df"/>'+
  '<rect x="49" y="44" width="50" height="11" fill="#f7b581"/>'+
  handoutTxt(74,52,'Para-Pak C&S',7.7,'#55372b',850)+
  handoutTxt(74,63,'Cary-Blair',7,'#715e55')+
  '<path d="M51 75h46" stroke="#bd3939" stroke-width="2" stroke-dasharray="3 2"/>'+
  handoutTxt(74,72,'FILL TO LINE',6.4,'#b33c40')+
  handoutTxt(74,88,'TRANSPORT',6.4,'#866b5f')+
  '<rect x="40" y="17" width="69" height="23" rx="6" fill="#f68a37" stroke="#d46b23" stroke-width="2"/>'+
  grooves+'<path d="M42 20h64" stroke="#ffc08c" stroke-width="1.7"/>'+
  (sealed?'<path d="m110 57 8 8 12-15" stroke="#168c81" stroke-width="5" fill="none" stroke-linejoin="round"/>':'');
}

function picture(kind){
const steel='#91aebc',teal='#258e87',ink='#547183';
const cup='<rect x="35" y="31" width="74" height="69" rx="8" fill="#fff" stroke="'+steel+'" stroke-width="3"/><path d="M31 30h82" stroke="'+steel+'" stroke-width="7" stroke-linecap="round"/>';
const vial=(x,col,fill)=>'<rect x="'+x+'" y="37" width="31" height="65" rx="6" fill="#fff" stroke="'+steel+'" stroke-width="2.5"/><rect x="'+(x-2)+'" y="23" width="35" height="18" rx="4" fill="'+col+'" stroke="'+steel+'" stroke-width="1"/><rect x="'+(x+4)+'" y="74" width="23" height="22" rx="2" fill="'+fill+'" opacity=".7"/>';
const check='<path d="m100 38 11 11 19-23" stroke="'+teal+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
let art='';
switch(kind){
case 'hat':art='<path d="M12 35h120l-19 70H31z" fill="#fff" stroke="'+steel+'" stroke-width="3"/><path d="M28 54h88l-12 37H40z" fill="#eef5f7"/><path d="M40 78c14-18 21-3 31-10s19-6 33 12v11H40z" fill="#a9896b"/>';break;
case 'orange':case 'orange-seal':art=vial(54,'#e6a04a','#e9c3a0')+'<path d="M57 79h24" stroke="#ad886a" stroke-dasharray="3 3" stroke-width="2"/>'+(kind==='orange-seal'?check:'');break;
case 'stool-swab':art=cup+'<path d="M45 17L97 82" stroke="#aa8b66" stroke-width="5" stroke-linecap="round"/><ellipse cx="96" cy="83" rx="8" ry="12" fill="#a58060" transform="rotate(-38 96 83)"/>';break;
case 'white-tube':art=vial(52,'#f5f6f7','#e0eced')+'<path d="M68 12v73" stroke="#aa9274" stroke-width="4"/><ellipse cx="68" cy="83" rx="5" ry="9" fill="#ad8e74"/>';break;
case 'vials':case 'vials-fill':art=vial(30,'#e8c967','#f2e7bf')+vial(81,'#e6b7c9','#f0d1dd')+(kind==='vials-fill'?'<path d="M32 79h80" stroke="#9d806c" stroke-dasharray="4 4" stroke-width="2"/>':'');break;
case 'wipe':art='<rect x="28" y="29" width="88" height="75" rx="10" fill="#fff" stroke="'+steel+'" stroke-width="3"/><path d="m38 81 25-26 24 22 20-17" stroke="#87bcb2" stroke-width="6" fill="none"/>';break;
case 'urine':art=cup+'<path d="M39 65h66v30H39z" fill="#edcc7f" opacity=".75"/>';break;
case 'mix':art=cup+'<path d="m50 14 32 69" stroke="#ad9675" stroke-width="4"/><ellipse cx="83" cy="83" rx="6" ry="8" fill="#e8ede8" stroke="'+steel+'"/><path d="M112 54q17 18 0 38" stroke="'+teal+'" stroke-width="3" fill="none"/>';break;
case 'transfer':art=cup+'<rect x="62" y="28" width="19" height="64" rx="5" fill="#fff" stroke="'+steel+'" stroke-width="2"/><rect x="58" y="19" width="27" height="15" rx="3" fill="#a0a5aa"/>';break;
case 'label':art=cup+vial(21,'#e5e9ee','#eef4f5')+'<rect x="58" y="51" width="43" height="30" rx="3" fill="#fff" stroke="'+steel+'"/><path d="M64 59h31M64 67h28M64 75h20" stroke="'+ink+'" stroke-width="2"/>';break;
case 'bag':art='<path d="M23 24h97v92H23z" fill="#eef8f4" stroke="'+steel+'" stroke-width="3"/><path d="M23 39h97" stroke="'+teal+'" stroke-width="3"/>'+vial(56,'#eceff1','#dfeaec');break;
case 'call':art='<rect x="44" y="16" width="57" height="102" rx="12" fill="#fff" stroke="'+steel+'" stroke-width="3"/><rect x="51" y="28" width="43" height="66" rx="5" fill="#edf7f5"/><path d="M61 52l8 11 12-11" stroke="'+teal+'" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="106" r="4" fill="'+steel+'"/>';break;
case 'clinic':art='<path d="M20 58 72 20l52 38v61H20z" fill="#eaf6f3" stroke="'+steel+'" stroke-width="3"/><rect x="57" y="76" width="32" height="43" fill="#fff" stroke="'+steel+'" stroke-width="2"/><path d="M72 32v24m-12-12h24" stroke="'+teal+'" stroke-width="6"/>';break;
case 'handoff':art='<path d="M13 87q25-11 39 0l21 4 6 13-24 7-43-5z" fill="#cce6df" stroke="'+steel+'" stroke-width="2"/>'+vial(61,'#ecf0f2','#e6eef0')+'<path d="M131 87q-22-13-35-2l-12 10-2 11 27-2 24-9" fill="#cce6df" stroke="'+steel+'" stroke-width="2"/>';break;
}
return '<svg viewBox="0 0 145 135" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+art+'</svg>';
}
const params=new URLSearchParams(location.search);
let chosen=guides.find(g=>g.id===params.get("guide"))||guides[0];
const choice=document.getElementById("chooser"),content=document.getElementById("content");
function draw(){
 const isDrop=chosen.id==='dropoff';
 const isCedarsChooser=chosen.id==='cedars-urine';
 const isCedarsType=!!chosen.subguide;
 const topChoice=isCedarsChooser||isCedarsType?'cedars-urine':chosen.id;
 choice.innerHTML=guides.filter(g=>!g.subguide).map(g=>
  '<button type="button" data-guide="'+g.id+'" aria-pressed="'+(g.id===topChoice)+'">'+g.short+'</button>'
 ).join('');
 const printButton=document.getElementById('print');
 printButton.disabled=isCedarsChooser;
 printButton.textContent=isCedarsChooser?'Choose a tube to print':'Print selected guide';
 if(isCedarsChooser){
  content.innerHTML='<article class="sheet"><header class="letterhead"><div class="brand">SOLLIS HEALTH / LABORATORY</div>'+
   '<div class="kind">PATIENT TAKE-HOME GUIDE</div></header>'+
   '<div class="section-kicker">CEDARS URINE COLLECTION</div>'+
   '<h1>Which urine test was ordered?</h1>'+
   '<p class="cedars-choice-intro">Two different collection tubes are used. Choose the one printed on your order or given to you by the clinic. If you are unsure, call the clinic before collecting.</p>'+
   '<div class="cedars-choice-grid">'+
    '<article class="cedars-choice"><div class="cedars-choice-visual">'+picture('cedars-gray')+'</div>'+
    '<span class="cedars-choice-tag">OPTION 1 · URINE CULTURE</span><h2>Gray-top C&amp;S tube</h2>'+
    '<p>Short, round-bottom tube with a gray cap. Used for the ordered urine culture (C&amp;S), not urinalysis.</p>'+
    '<button type="button" data-cedars-choice="cedars-urine-culture">Open urine culture instructions</button></article>'+
    '<article class="cedars-choice"><div class="cedars-choice-visual">'+picture('cedars-ua')+'</div>'+
    '<span class="cedars-choice-tag">OPTION 2 · URINALYSIS</span><h2>Red/yellow swirl-top UA tube</h2>'+
    '<p>Taller UA preservative tube with a distinctive red and yellow swirled cap and tapered base.</p>'+
    '<button type="button" data-cedars-choice="cedars-urine-ua">Open urinalysis instructions</button></article>'+
   '</div>'+
   '<div class="warning"><strong>Important:</strong> Only use the tube(s) your clinic provided and instructed you to collect. The tube for a urine culture is not interchangeable with the UA preservative tube.</div>'+
   '<footer class="footer"><span>Questions? Call your clinic and ask for a nurse.<br><strong>310-870-0400</strong></span>'+
   '<span class="footer-meta">Choose the correct guide before printing.</span></footer></article>';
  document.title='Sollis Patient Instructions | Choose Cedars urine tube';
  return;
 }
 const rows=chosen.steps.map((entry,i)=>
  '<article class="step"><span class="step-no" aria-label="Step '+(i+1)+'">'+String(i+1).padStart(2,'0')+'</span>'+
  '<div class="step-body"><h2>'+entry[0]+'</h2><p>'+entry[1]+'</p></div>'+
  '<div class="step-picture">'+picture(entry[2])+'</div></article>'
 ).join('');
 const returnNote='Call your clinic before drop-off and return the labeled, sealed sample the same day when possible. Give it directly to staff. Storage requirements vary by test.';
 const cedarsImage=isCedarsType?(chosen.id==='cedars-urine-culture'?'cedars-gray':'cedars-ua'):'';
 content.innerHTML='<article class="sheet"><header class="letterhead"><div class="brand">SOLLIS HEALTH / LABORATORY</div>'+
  '<div class="kind">PATIENT TAKE-HOME GUIDE</div></header>'+
  '<div class="section-kicker">'+(isDrop?'SPECIMEN RETURN':'AT-HOME COLLECTION')+'</div>'+
  '<h1>'+chosen.title+'</h1><p class="intro">'+chosen.intro+'</p>'+
  (isCedarsType?'<button type="button" class="cedars-back" data-cedars-back>← Choose a different Cedars urine test</button>':'')+
  '<div class="kit"><strong>'+(isDrop?'BRING WITH YOU':'COLLECTION KIT')+'</strong><span>'+chosen.kit+'</span></div>'+
  (isCedarsType?'<div class="cedars-kit-id">'+picture(cedarsImage)+'<div><strong>'+(chosen.id==='cedars-urine-culture'?'GRAY-TOP · URINE CULTURE (C&amp;S)':'RED/YELLOW SWIRL-TOP · URINALYSIS')+'</strong><span>Make sure the cap color matches the actual tube provided by the clinic before collecting.</span></div></div>':'')+
  '<h2 class="steps-title">'+(isDrop?'Before you come to the clinic':'How to collect your specimen')+'</h2>'+
  '<section class="steps" aria-label="'+(isDrop?'Specimen drop-off checklist':'Collection instructions')+'">'+rows+'</section>'+
  (isDrop?'':'<aside class="return"><div class="return-picture">'+picture('clinic')+'</div>'+
   '<div><h2>Returning your specimen</h2><p>'+returnNote+'</p></div></aside>')+
  '<div class="warning"><strong>Important:</strong> '+chosen.warning+'</div>'+
  '<footer class="footer"><span>Questions? Call your clinic and ask for a nurse.<br><strong>310-870-0400</strong></span>'+
  '<span class="footer-meta">Follow the instructions for your exact kit.<br>Do not leave specimens unattended.</span></footer></article>';
 document.title='Sollis Patient Instructions | '+chosen.short;
}
choice.addEventListener('click',function(e){const button=e.target.closest('[data-guide]');if(!button)return;const selected=guides.find(g=>g.id===button.dataset.guide);if(!selected)return;chosen=selected;history.replaceState(null,'','?guide='+encodeURIComponent(chosen.id));draw();});
content.addEventListener('click',function(event){
 const guideChoice=event.target.closest('[data-cedars-choice]');
 const goBack=event.target.closest('[data-cedars-back]');
 if(!guideChoice&&!goBack)return;
 const id=guideChoice?guideChoice.dataset.cedarsChoice:'cedars-urine';
 const next=guides.find(g=>g.id===id);
 if(!next)return;
 chosen=next;
 history.replaceState(null,'','?guide='+encodeURIComponent(id));
 draw();
 window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('print').addEventListener('click',()=>window.print());
draw();
})();
</script>
</body>
</html>
